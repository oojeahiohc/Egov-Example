server.port=8082

# 수동 Bean이 자동 Bean을 오버라이딩하게 설정
spring.main.allow-bean-definition-overriding=true

# open-in-view(혹은 Open-Session-In-View(OSIV))
# true(기본값) : 사용자에게 응답 또는 view가 렌더링될 때까지 영속성 컨텍스트 유지
# false : 트랜젝션이 종료될 때 영속성 컨텍스트 종료
spring.jpa.open-in-view=false

# 권한 인증방식 : 세션 방식으로 사용자 권한을 인증함
Globals.Auth = session

# 세션 방식 간소화 설정
org.egovframe.access.globalAuthen=session
org.egovframe.access.mappingPath=/**
org.egovframe.access.dataSource=dataSource
org.egovframe.access.loginUrl=/sample/login
org.egovframe.access.accessDeniedUrl=/sample/accessDenied
org.egovframe.access.sqlAuthorityUser=SELECT USER_ID USERID, AUTHOR_CODE AUTHORITY FROM AUTHORITIES
org.egovframe.access.sqlRoleAndUrl=SELECT a.ROLE_PTTRN URL, b.AUTHOR_CODE AUTHORITY FROM ROLES a, AUTHROLES b WHERE a.ROLE_CODE = b.ROLE_CODE AND a.ROLE_TY = 'url' ORDER BY a.ROLE_SORT
org.egovframe.access.requestMatcherType=ant
org.egovframe.access.excludeList=/css/**, /error/**, /fonts/**, /img/**, /js/**, /, /sample/login, /sample/loginProcess, /sample/logout, /sample/accessDenied, /sample/hello