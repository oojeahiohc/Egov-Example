<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	<title th:text="#{title.sample}"></title>

	<!-- KRDS CSS -->
	<link rel="stylesheet" type="text/css" th:href="@{/css/component/output.css}"/>
	<link rel="stylesheet" type="text/css" th:href="@{/css/egovframe.css}"/>
	<script th:inline="javascript" th:src="@{/js/jquery.min.js}"></script>
	<script th:inline="javascript" th:src="@{/js/egovframework/common.js}" defer></script>
	
	<style>
		.page-header {
			display: flex;
			justify-content: space-between;
			align-items: center;
			margin-bottom: 20px;
		}
		.user-info {
			display: flex;
			align-items: center;
			gap: 15px;
		}
		.user-id {
			font-size: 16px;
			font-weight: 500;
			color: #333;
		}
		.user-id strong {
			color: #0066cc;
			margin-left: 5px;
		}
	</style>

	<script th:inline="javascript" defer>
		document.addEventListener('DOMContentLoaded', function() {
			sampleList();
	    });

		function sampleSearch() {
			if (notNullCheck($('#searchKeyword').val())) {
				sampleList();
			} else {
				alert(/*[[#{search.error}]]*/'검색어를 입력해주세요.');
			}
		}

		function samplePagination(pageIndex) {
			$('#pageIndex').val(pageIndex);
			sampleList();
		}

		function sampleList() {
	        $.ajax({
	            url: contextPath + '/sample/list',
	            method: 'post',
	            data: $('#listForm').serialize()
	        }).done(function(response) {
	            let sampleList = response.sampleList;
	            let totalCount = response.totalCount;
	            let pagination = response.pagination;
	            let lineNumber = response.lineNumber;

	            let html = '';
	            if(sampleList.length === 0){
	                html = `<tr><td class="text-center" colspan="6">[(#{info.nodata.msg})]</td></tr>`
	            } else {
	            	sampleList.forEach(function(sample, index) {
	            		let number = totalCount - (lineNumber + index + 1);
	                    html += '<tr>';
	                    html += '<td class="text-center">'+number+'</td>';
	                    html += '<td class="text-center"><a href="javascript:sampleDetail(\''+sample.id+'\')" class="btn btn-txt sm">'+sample.id+'</a></td>';
	                    html += '<td class="text-center">'+sample.name+'</td>';
	                    html += '<td class="text-center">'+sample.description+'</td>';
	                    if (sample.useYn === 'Y') {
	                    	html += '<td class="text-center">[(#{input.yes})]</td>';
	                    } else {
	                    	html += '<td class="text-center">[(#{input.no})]</td>';
	                    }
	                    html += '<td class="text-center">'+sample.regUser+'</td>';
	                    html += '</tr>';
	                });
	            }
	            $('#sample-list-container').html(html);
	            $('#pagination-container').html(pagination);
	        });
		}

		function sampleCreate() {
			$(location).attr('href', contextPath + '/sample/add');
		}

		function sampleDetail(id) {
			$('#id').val(id);
			$('#listForm').attr('method', 'post').attr('action', contextPath + '/sample/detail').submit();
		}
	</script>
</head>

<body>
<div id="container" class="inner">

	<!-- Page Title -->
	<div class="page-header">
		<h2 class="heading-large" th:text="#{list.sample}"></h2>
		<div class="user-info" th:if="${username != null}">
			<span class="user-id">
				<span th:text="#{login.title}">로그인</span>:
				<strong th:text="${username}" th:title="#{login.username.default}">사용자</strong>
			</span>
			<a th:href="@{/sample/logout}" class="krds-btn small secondary" th:text="#{login.logout}">로그아웃</a>
		</div>
	</div>

	<div id="content_pop">
		<form id="listForm" th:object="${sampleVO}">
			<input type="hidden" th:id="id" th:name="id" />
			<input type="hidden" th:id="pageIndex" th:name="pageIndex" th:value="1" />

			<!-- Search Form -->
			<div class="form-group">
				<div class="search-wrap">
					<div class="search-body">
						<div class="form-conts searchOption">
							<select id="searchCondition" name="searchCondition" class="krds-form-select medium" th:title="#{search.choose}">
								<option th:text="Name" th:value="1" th:selected="${sampleVO.searchCondition} == 1"></option>
								<option th:text="ID" th:value="0" th:selected="${sampleVO.searchCondition} == 0"></option>
							</select>
						</div>
						<div class="form-conts btn-ico-wrap searchKeyword">
							<input type="text" id="searchKeyword" name="searchKeyword" th:value="${sampleVO.searchKeyword}" class="krds-input medium" th:placeholder="#{search.keyword}">
							<button type="button" class="krds-btn medium icon" th:onclick="sampleSearch()">
								<span class="sr-only" th:text="#{button.search}"></span>
								<i class="svg-icon ico-sch"></i>
							</button>
						</div>
					</div>
					<div class="page-btn-wrap">
						<button type="button" class="krds-btn medium" th:text="#{button.create}" th:onclick="sampleCreate()"></button>
					</div>
				</div>
			</div>
		</form>

		<!-- List -->
		<div class="krds-table-wrap">
			<table class="tbl col data">
				<colgroup>
					<col style="width: 10%;">
					<col style="width: 20%;">
					<col style="width: 20%;">
					<col style="width: 30%;">
					<col style="width: 10%;">
					<col style="width: 10%;">
				</colgroup>
				<thead>
					<tr>
						<th scope="col" class="text-center">No</th>
						<th scope="col" class="text-center"><span th:text="#{title.sample.id}"></span></th>
						<th scope="col" class="text-center"><span th:text="#{title.sample.name}"></span></th>
						<th scope="col" class="text-center"><span th:text="#{title.sample.description}"></span></th>
						<th scope="col" class="text-center"><span th:text="#{title.sample.useYn}"></span></th>
						<th scope="col" class="text-center"><span th:text="#{title.sample.regUser}"></span></th>
					</tr>
				</thead>
				<tbody id="sample-list-container"></tbody>
			</table>
		</div>

		<!-- Pagination -->
		<div id="pagination-container" class="krds-pagination w-page"></div>

	</div>

</div>

</body>
</html>
